[package]
name = "ct-unleash-engine"
version = "0.2.0"
edition = "2021"
description = "Fast PyO3 binding to yggdrasil-core that behaves exactly like yggdrasil-engine 1.3.1, with no JSON marshalling on the hot path."
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# The stable-ABI floor decides how context strings reach Rust: a 3.10+ wheel
# borrows each string's UTF-8 buffer, a 3.8 wheel has to copy it. Publish both;
# pip installs the newest one the interpreter supports.
default = ["abi3-py38"]
abi3-py38 = ["pyo3/abi3-py38"]
abi3-py310 = ["pyo3/abi3-py310"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
# Pinned to what yggdrasil-engine 1.3.1 ships: its native library reports core
# 0.21.3 and embeds serde_json 1.0.150. Matching both keeps evaluation and the
# JSON fallback path identical to the reference engine. Bump them only together
# with the reference version the differential tests run against.
unleash-yggdrasil = { version = "=0.21.3", features = ["wall-clock"] }
serde_json = "=1.0.150"
serde = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = true
codegen-units = 1

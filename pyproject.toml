[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "ct-unleash-engine"
version = "0.1.0"
description = "Fast PyO3 binding to yggdrasil-core (native-context evaluation, no JSON marshalling on the hot path)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest", "yggdrasil-engine>=1.3.0"]

[tool.maturin]
# Mixed Rust/Python layout: the compiled extension is ct_unleash_engine._native,
# wrapped by the hand-written Python package under python/.
python-source = "python"
module-name = "ct_unleash_engine._native"
features = ["pyo3/extension-module"]
